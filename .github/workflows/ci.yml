name: QuickCart CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned LTS Qt version across all platforms and target architectures
  PINNED_QT_VERSION: '6.8.2'

jobs:
  # ── 1. Quality & Linting (CI Infrastructure) ──────────────────────────────
  lint-and-format:
    name: CI Infrastructure (Linux Host) - Lint & Format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format libgl1-mesa-dev libxkbcommon-dev libx11-xcb1 libxrender1 libxi6 libfontconfig1 libdbus-1-3

      - name: Install Qt ${{ env.PINNED_QT_VERSION }} (CI Tooling)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.PINNED_QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtshadertools'

      - name: Run Clang-Format Check
        run: |
          find core security api models tests -name "*.h" -o -name "*.cpp" | xargs clang-format --dry-run --Werror

      - name: Run QmlLint
        run: |
          qmllint \
            -I qml \
            -I qml/theme \
            -I qml/responsive \
            -I qml/navigation \
            -I qml/i18n \
            -I qml/icons \
            -I qml/config \
            -I qml/components \
            qml/main.qml \
            qml/theme/Theme.qml \
            qml/theme/Metrics.qml \
            qml/responsive/Responsive.qml \
            qml/navigation/Router.qml \
            qml/i18n/Strings.qml \
            qml/icons/Icons.qml \
            qml/config/Config.qml \
            qml/components/AppScaffold.qml \
            qml/components/CustomButton.qml \
            qml/components/CustomTextField.qml \
            qml/components/GlassCard.qml \
            qml/components/HeaderBar.qml \
            qml/components/ThemeSelector.qml \
            qml/views/AdminView.qml \
            qml/views/AuthView.qml \
            qml/views/CustomerView.qml \
            qml/views/DeliveryView.qml \
            qml/views/ShopkeeperView.qml

  # ── 2. Backend & Contract Tests (CI Infrastructure) ───────────────────────
  backend-test:
    name: CI Infrastructure (Linux Host) - Backend & Contract Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck Backend (TypeScript)
        working-directory: backend
        run: ./node_modules/.bin/tsc -p ./tsconfig.json --noEmit

      - name: Run Backend Integration Test Suite
        working-directory: backend
        run: npm test

  # ── 3. Windows Desktop (Supported Platform) ───────────────────────────────
  windows-build-and-test:
    name: Windows Desktop - Build, DPAPI Tests & Packaging
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt ${{ env.PINNED_QT_VERSION }} (Windows MSVC)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.PINNED_QT_VERSION }}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtshadertools'

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build All Targets
        run: cmake --build build --parallel

      - name: Setup Node.js for Backend Contract Tests
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Start Real Backend Test Server & Run Windows CTest
        shell: powershell
        run: |
          cd backend
          npm ci
          $serverProc = Start-Process -FilePath "npx" -ArgumentList "ts-node src/standalone-test-server.ts" -PassThru -NoNewWindow -RedirectStandardOutput "..\backend.log" -RedirectStandardError "..\backend_err.log"
          Write-Host "Started Backend Test Server (PID: $($serverProc.Id))"
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 1
            try {
              $resp = Invoke-WebRequest -Uri "http://127.0.0.1:3000/api/health" -UseBasicParsing -TimeoutSec 2
              if ($resp.StatusCode -eq 200) {
                Write-Host "Backend is ready on attempt $i"
                $ready = $true
                break
              }
            } catch {}
          }
          if (-not $ready) {
            Write-Host "Backend server failed to start!"
            Get-Content "..\backend.log" -ErrorAction SilentlyContinue
            Get-Content "..\backend_err.log" -ErrorAction SilentlyContinue
            Stop-Process -Id $serverProc.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QUICKCART_BACKEND_URL = "http://127.0.0.1:3000/api"
          try {
            Write-Host "Seeding native Windows UI goldens on Windows runner..."
            $env:QUICKCART_GENERATE_GOLDENS = "1"
            ctest --test-dir build -C Release -R test_responsive_ui --output-on-failure
            $env:QUICKCART_GENERATE_GOLDENS = "0"
            Write-Host "Executing full CTest suite on Windows runner..."
            ctest --test-dir build -C Release --output-on-failure
          } finally {
            Stop-Process -Id $serverProc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Stage Windows Release Binary
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item -Path build\QuickCartApp.exe -Destination dist\
          windeployqt --release --qmldir qml dist\QuickCartApp.exe

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quickcart-windows-x64
          path: dist/*
          if-no-files-found: ignore

  # ── 4. macOS Host Tests & Golden Verification ─────────────────────────────
  macos-build-and-test:
    name: macOS Host - C++ Tests & Golden Verification
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Tools (macOS)
        run: brew install cmake ninja openssl@3

      - name: Install Qt ${{ env.PINNED_QT_VERSION }} (macOS Clang)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.PINNED_QT_VERSION }}
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtshadertools'

      - name: Configure CMake
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build All Targets
        run: cmake --build build --parallel

      - name: Setup Node.js for Backend Contract Tests
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Start Real Backend Test Server & Execute CTest
        run: |
          cd backend
          npm ci
          npx ts-node src/standalone-test-server.ts > ../backend.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          trap "kill -9 $SERVER_PID 2>/dev/null || true" EXIT
          echo "Waiting for backend server to become ready on http://127.0.0.1:3000/api/health..."
          READY=0
          for i in {1..60}; do
            if curl -s -f http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              echo "Backend is ready! (Attempt $i)"
              READY=1
              break
            fi
            sleep 1
          done
          if [ $READY -ne 1 ]; then
            echo "Backend failed to start within 60 seconds!"
            cat ../backend.log
            exit 1
          fi
          curl -s http://127.0.0.1:3000/api/health
          cd ..
          ctest --test-dir build --output-on-failure

      - name: Memory Leak Detection (macOS native leaks)
        run: |
          echo "Running macOS native leaks tool on core test binaries..."
          leaks --atExit -- build/test_securestorage
          leaks --atExit -- build/test_validators
          leaks --atExit -- build/test_orderstatemachine

      - name: Upload UI Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-screenshots-macos
          path: |
            build/screenshots/*.png
            tests/golden/macos/*.png
          if-no-files-found: ignore

  # ── 5. macOS Sanitizers & Coverage Enforcement ────────────────────────────
  macos-sanitizers-and-coverage:
    name: macOS Host - ASan/UBSan & Coverage
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Tools (macOS)
        run: brew install cmake ninja openssl@3 python3

      - name: Install Qt ${{ env.PINNED_QT_VERSION }} (macOS Clang)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.PINNED_QT_VERSION }}
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtshadertools'

      - name: Configure CMake with Sanitizers & Coverage
        run: |
          cmake -B build-san-cov -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SANITIZERS=ON \
            -DENABLE_COVERAGE=ON

      - name: Compile Sanitized & Coverage Targets
        run: cmake --build build-san-cov --parallel

      - name: Setup Node.js for Backend Contract Tests
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Start Real Backend Test Server & Run Sanitized Tests
        run: |
          cd backend
          npm ci
          npx ts-node src/standalone-test-server.ts > ../backend.log 2>&1 &
          SERVER_PID=$!
          trap "kill -9 $SERVER_PID 2>/dev/null || true" EXIT
          for i in {1..60}; do
            if curl -s -f http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          cd ..
          export QT_QPA_PLATFORM=offscreen
          export QUICKCART_BACKEND_URL=http://127.0.0.1:3000/api
          # Note: LeakSanitizer (LSan) is unavailable on Apple Silicon macOS and Windows; detect_leaks disabled
          export ASAN_OPTIONS=detect_leaks=0:abort_on_error=1
          export UBSAN_OPTIONS=halt_on_error=0:print_stacktrace=1
          ctest --test-dir build-san-cov --output-on-failure

  # ── 6. iOS Target Build (Unsigned Simulator) ──────────────────────────────
  ios-build:
    name: iOS Target - Simulator Build (Unsigned)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Tools (macOS)
        run: brew install cmake ninja openssl@3

      - name: Install Qt ${{ env.PINNED_QT_VERSION }} (iOS)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.PINNED_QT_VERSION }}
          host: 'mac'
          target: 'ios'
          arch: 'ios'
          modules: 'qtshadertools'

      - name: Configure CMake for iOS Simulator
        run: |
          cmake -B build-ios -S . -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphonesimulator \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF

      - name: Build iOS Target (Unsigned)
        run: |
          cmake --build build-ios --config Release --target QuickCart -- -sdk iphonesimulator CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

  # ── 7. Android Cross-Compilation & APK (CI Infrastructure) ────────────────
  android-build:
    name: CI Infrastructure (Linux Host) - Android Build & APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Host Qt ${{ env.PINNED_QT_VERSION }} (CI Tooling)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.PINNED_QT_VERSION }}
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtshadertools'
          dir: '${{ runner.temp }}/qt-host'

      - name: Install Target Qt ${{ env.PINNED_QT_VERSION }} (Android ARM64)
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.PINNED_QT_VERSION }}
          target: 'android'
          arch: 'android_arm64_v8a'
          dir: '${{ runner.temp }}/qt-android'

      - name: Configure & Compile Android Target
        run: |
          export QT_HOST_PATH=$(find "${{ runner.temp }}/qt-host" -type d -name "gcc_64" | head -n 1)
          export QT_TOOLCHAIN=$(find "${{ runner.temp }}/qt-android" -name "qt.toolchain.cmake" | head -n 1)
          export ANDROID_NDK_ROOT=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -name "26.*" -o -name "25.*" 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$ANDROID_NDK_ROOT" ]; then
            export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME}}"
          fi
          echo "Using QT_HOST_PATH: $QT_HOST_PATH"
          echo "Using QT_TOOLCHAIN: $QT_TOOLCHAIN"
          echo "Using ANDROID_NDK_ROOT: $ANDROID_NDK_ROOT"
          cmake -B build-android -S . -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$QT_TOOLCHAIN" \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-33 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF
          cmake --build build-android --target QuickCart --parallel
