name: QuickCart CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Quality & Linting ──────────────────────────────────────────────────
  lint-and-format:
    name: Code Formatting & QML Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format libgl1-mesa-dev libxkbcommon-dev libx11-xcb1 libxrender1 libxi6 libfontconfig1 libdbus-1-3

      - name: Install Qt 6.11 (Linux)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.0'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtshadertools'

      - name: Run Clang-Format Check
        run: |
          find core security api models tests -name "*.h" -o -name "*.cpp" | xargs clang-format --dry-run --Werror

      - name: Run QmlLint
        run: |
          qmllint \
            -I qml \
            -I qml/theme \
            -I qml/responsive \
            -I qml/navigation \
            -I qml/i18n \
            -I qml/icons \
            -I qml/config \
            -I qml/components \
            qml/main.qml \
            qml/theme/Theme.qml \
            qml/theme/Metrics.qml \
            qml/responsive/Responsive.qml \
            qml/navigation/Router.qml \
            qml/i18n/Strings.qml \
            qml/icons/Icons.qml \
            qml/config/Config.qml \
            qml/components/AppScaffold.qml \
            qml/components/CustomButton.qml \
            qml/components/CustomTextField.qml \
            qml/components/GlassCard.qml \
            qml/components/HeaderBar.qml \
            qml/components/ThemeSelector.qml \
            qml/views/AdminView.qml \
            qml/views/AuthView.qml \
            qml/views/CustomerView.qml \
            qml/views/DeliveryView.qml \
            qml/views/ShopkeeperView.qml

  # ── 2. Multi-Platform Build & CTest Matrix (macOS + Linux) ────────────────
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
        include:
          - os: macos-14
            cmake_args: "-DCMAKE_BUILD_TYPE=Release"
          - os: ubuntu-24.04
            cmake_args: "-DCMAKE_BUILD_TYPE=Release"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt 6.11 (macOS)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.0'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'
          modules: 'qtshadertools'

      - name: Install System Tools (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja openssl@3

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build libssl-dev \
            libgl1-mesa-dev libxkbcommon-dev libx11-xcb1 libxrender1 libxi6 libfontconfig1 libdbus-1-3

      - name: Install Qt 6.11 (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.0'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtshadertools'

      - name: Configure CMake
        run: |
          cmake -B build -S . -G Ninja ${{ matrix.cmake_args }}

      - name: Build All Targets
        run: cmake --build build --parallel

      - name: Setup Node.js for Backend Contract Tests
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Start Real Backend Test Server & Execute CTest
        run: |
          cd backend
          npm ci
          npx ts-node src/standalone-test-server.ts > ../backend.log 2>&1 &
          SERVER_PID=$!
          trap "kill -9 $SERVER_PID 2>/dev/null || true" EXIT
          echo "Waiting for backend server to become ready on http://127.0.0.1:3000/api/health..."
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              echo "Backend is ready! (Attempt $i)"
              break
            fi
            sleep 1
          done
          curl -s http://127.0.0.1:3000/api/health || {
            echo "Backend failed to start!"
            cat ../backend.log
            exit 1
          }
          cd ..
          export QT_QPA_PLATFORM=offscreen
          export QUICKCART_BACKEND_URL=http://127.0.0.1:3000/api
          ctest --test-dir build --output-on-failure

      - name: Upload UI Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-screenshots-${{ matrix.os }}
          path: |
            build/screenshots/*.png
            tests/golden/*.png
          if-no-files-found: ignore

  # ── 3. Memory Safety & Sanitizers (ASan + UBSan) ──────────────────────────
  sanitizers:
    name: AddressSanitizer & UBSan (Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build libssl-dev \
            libgl1-mesa-dev libxkbcommon-dev libx11-xcb1 libxrender1 libxi6 libfontconfig1 libdbus-1-3

      - name: Install Qt 6.11 (Linux)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.0'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtshadertools'

      - name: Configure CMake with Sanitizers
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build-asan -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SANITIZERS=ON

      - name: Compile Sanitized Targets
        run: cmake --build build-asan --parallel

      - name: Setup Node.js for Backend Contract Tests
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Start Real Backend Test Server & Run Sanitized Tests
        run: |
          cd backend
          npm ci
          npx ts-node src/standalone-test-server.ts > ../backend.log 2>&1 &
          SERVER_PID=$!
          trap "kill -9 $SERVER_PID 2>/dev/null || true" EXIT
          echo "Waiting for backend server to become ready on http://127.0.0.1:3000/api/health..."
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              echo "Backend is ready! (Attempt $i)"
              break
            fi
            sleep 1
          done
          curl -s http://127.0.0.1:3000/api/health || {
            echo "Backend failed to start!"
            cat ../backend.log
            exit 1
          }
          cd ..
          export QT_QPA_PLATFORM=offscreen
          export QUICKCART_BACKEND_URL=http://127.0.0.1:3000/api
          export ASAN_OPTIONS=detect_leaks=1:abort_on_error=1
          export LSAN_OPTIONS=suppressions=${{ github.workspace }}/scripts/lsan.supp:print_suppressions=0
          export UBSAN_OPTIONS=halt_on_error=0:print_stacktrace=1
          ctest --test-dir build-asan --output-on-failure

  # ── 4. Code Coverage Threshold Enforcement ────────────────────────────────
  coverage:
    name: Code Coverage Enforcement (Linux)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build libssl-dev python3 gcovr lcov \
            libgl1-mesa-dev libxkbcommon-dev libx11-xcb1 libxrender1 libxi6 libfontconfig1 libdbus-1-3

      - name: Install Qt 6.11 (Linux)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.0'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtshadertools'

      - name: Configure CMake with Coverage
        run: |
          cmake -B build-cov -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_COVERAGE=ON

      - name: Compile Coverage Targets
        run: cmake --build build-cov --parallel

      - name: Setup Node.js for Backend Contract Tests
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Start Real Backend Test Server & Execute CTest Suites
        run: |
          cd backend
          npm ci
          npx ts-node src/standalone-test-server.ts > ../backend.log 2>&1 &
          SERVER_PID=$!
          trap "kill -9 $SERVER_PID 2>/dev/null || true" EXIT
          echo "Waiting for backend server to become ready on http://127.0.0.1:3000/api/health..."
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              echo "Backend is ready! (Attempt $i)"
              break
            fi
            sleep 1
          done
          curl -s http://127.0.0.1:3000/api/health || {
            echo "Backend failed to start!"
            cat ../backend.log
            exit 1
          }
          cd ..
          export QT_QPA_PLATFORM=offscreen
          export QUICKCART_BACKEND_URL=http://127.0.0.1:3000/api
          ctest --test-dir build-cov --output-on-failure

      - name: Enforce Minimum Coverage Threshold
        run: python3 scripts/coverage_report.py build-cov

      - name: Generate gcovr HTML Coverage Report
        if: always()
        run: |
          gcovr --html-details -o build-cov/coverage.html --exclude-throw-branches \
            --filter "core/" --filter "models/" --filter "api/" --filter "security/" \
            --root . build-cov

      - name: Upload Coverage HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: build-cov/coverage*.html
          if-no-files-found: ignore

  # ── 5. Windows Desktop Build Check ────────────────────────────────────────
  windows-build:
    name: Windows Build Check
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Qt 6.8 (Windows MSVC)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtshadertools'

      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: |
          cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build Targets
        run: cmake --build build --parallel

      - name: Execute Windows CTest
        run: |
          $env:QT_QPA_PLATFORM="offscreen"
          ctest --test-dir build -C Release -R test_securestorage --output-on-failure

  # ── 6. Android Cross-Compilation Check ────────────────────────────────────
  android-build-check:
    name: Android Build Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Host Qt 6.7.3 (Linux Desktop)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          modules: 'qtshadertools'
          dir: '${{ runner.temp }}/qt-host'

      - name: Install Target Qt 6.7.3 (Android ARM64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          target: 'android'
          arch: 'android_arm64_v8a'
          dir: '${{ runner.temp }}/qt-android'

      - name: Configure & Verify Android Toolchain
        run: |
          export QT_HOST_PATH=$(find "${{ runner.temp }}/qt-host" -type d -name "gcc_64" | head -n 1)
          export QT_TOOLCHAIN=$(find "${{ runner.temp }}/qt-android" -name "qt.toolchain.cmake" | head -n 1)
          export ANDROID_NDK_ROOT=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -name "26.*" -o -name "25.*" 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$ANDROID_NDK_ROOT" ]; then
            export ANDROID_NDK_ROOT="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME}}"
          fi
          echo "Using QT_HOST_PATH: $QT_HOST_PATH"
          echo "Using QT_TOOLCHAIN: $QT_TOOLCHAIN"
          echo "Using ANDROID_NDK_ROOT: $ANDROID_NDK_ROOT"
          cmake -B build-android -S . -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$QT_TOOLCHAIN" \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-33 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF 2>&1 | tee cmake_android.log || {
              echo "### Android CMake Configuration Failed" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              cat cmake_android.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit 1
            }
          cmake --build build-android --target QuickCart --parallel 2>&1 | tee -a cmake_android.log || {
            echo "### Android Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 100 cmake_android.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

  # ── 8. Backend & Contract Testing ─────────────────────────────────────────
  backend-test:
    name: Backend & Contract Tests (Node.js & MongoDB)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Typecheck Backend (TypeScript)
        working-directory: backend
        run: ./node_modules/.bin/tsc -p ./tsconfig.json --noEmit

      - name: Run Backend Integration Test Suite
        working-directory: backend
        run: npm test
