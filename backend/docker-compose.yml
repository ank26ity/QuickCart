version: '3.8'

services:
  mongo1:
    image: mongo:7.0
    container_name: quickcart_mongo1
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - mongo1_data:/data/db
    networks:
      - quickcart_net

  mongo2:
    image: mongo:7.0
    container_name: quickcart_mongo2
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27018:27017"
    volumes:
      - mongo2_data:/data/db
    networks:
      - quickcart_net

  mongo3:
    image: mongo:7.0
    container_name: quickcart_mongo3
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27019:27017"
    volumes:
      - mongo3_data:/data/db
    networks:
      - quickcart_net

  mongo-init:
    image: mongo:7.0
    container_name: quickcart_mongo_init
    depends_on:
      - mongo1
      - mongo2
      - mongo3
    networks:
      - quickcart_net
    entrypoint: >
      bash -c "
        echo 'Waiting for MongoDB nodes to start...' &&
        sleep 5 &&
        mongosh --host mongo1:27017 --eval '
          try {
            rs.status();
            console.log(\"Replica set already initialized\");
          } catch(e) {
            rs.initiate({
              _id: \"rs0\",
              members: [
                { _id: 0, host: \"mongo1:27017\", priority: 2 },
                { _id: 1, host: \"mongo2:27017\", priority: 1 },
                { _id: 2, host: \"mongo3:27017\", priority: 1 }
              ]
            });
            console.log(\"Replica set rs0 initialized successfully\");
          }
        '
      "

  redis:
    image: redis:7.2-alpine
    container_name: quickcart_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - quickcart_net

  mongo-express:
    image: mongo-express:1.0.2-alpha.4
    container_name: quickcart_mongo_express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0"
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo1
      - mongo-init
    networks:
      - quickcart_net

networks:
  quickcart_net:
    driver: bridge

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
  redis_data:
